name: Build Android APK

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Capacitor Android APK
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Waktu Solat Malaysia" "com.kwikezee.waktusolat" --web-dir="./"
          npx cap add android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../WaktuSolatMalaysia.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WaktuSolatMalaysia-Android-APK
          path: WaktuSolatMalaysia.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.3
          name: Waktu Solat Malaysia Native APK v1.1.3
          draft: false
          prerelease: false
          files: WaktuSolatMalaysia.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
