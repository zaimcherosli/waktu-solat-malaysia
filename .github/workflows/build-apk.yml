name: Build Android APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Add Capacitor Android Platform & Build APK
        run: |
          npx cap init "Solat Malaysia" "com.kwikezee.waktusolat" --web-dir="./"
          npx cap add android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../WaktuSolatMalaysia.apk

      - name: Create GitHub Release with Valid APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Waktu Solat Malaysia Native APK ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: WaktuSolatMalaysia.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
