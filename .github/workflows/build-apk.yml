name: Build Android APK

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap CLI & Build APK
        run: |
          npm install -g @bubblewrap/cli
          npx @bubblewrap/cli init --manifest=https://waktusolatmy.pages.dev/manifest.json --directory=android-twa || true
          if [ -d "android-twa" ]; then
            cd android-twa
            ./gradlew assembleDebug || ./gradlew build
            cp app/build/outputs/apk/debug/app-debug.apk ../WaktuSolatMalaysia.apk
          fi

      - name: Fallback Capacitor APK Build
        if: "!hashFiles('WaktuSolatMalaysia.apk')"
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Waktu Solat Malaysia" "com.kwikezee.waktusolat" --web-dir="./"
          npx cap add android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../WaktuSolatMalaysia.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WaktuSolatMalaysia-Android-APK
          path: WaktuSolatMalaysia.apk
